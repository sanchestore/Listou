<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listou</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --card-border:#e6dcdf;
    --accent:#7a1330; --accent-light:#9c2a49; --text:#000000; --muted:#6b6b6b;
    --done-bg:#f4e9ec;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141014; --card:#211a1d; --card-border:#3a2a30;
      --accent:#c24a6b; --accent-light:#d97090; --text:#ffffff; --muted:#b8adb1;
      --done-bg:#2a1e22;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141014; --card:#211a1d; --card-border:#3a2a30;
    --accent:#c24a6b; --accent-light:#d97090; --text:#ffffff; --muted:#b8adb1;
    --done-bg:#2a1e22;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100%;
  }
  header{
    background:#620113; color:#fff; padding:10px 16px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  header img.logo{height:38px; display:block;}
  #statusDot{color:rgba(255,255,255,0.75); font-weight:700;}
  .container{max-width:520px; margin:0 auto; padding:14px 14px 90px;}
  .cal{background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:12px; margin-bottom:14px; display:none;}
  .date-bar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .date-bar button.nav{background:none; border:none; color:var(--accent); font-size:22px; font-weight:900; padding:2px 8px; cursor:pointer;}
  .date-bar .date-bar-label{flex:1; text-align:center; font-weight:800; font-size:15px; text-transform:capitalize;}
  .date-bar button.cal-toggle{
    background:var(--card); border:1px solid var(--card-border); border-radius:10px;
    padding:8px 11px; font-size:17px; cursor:pointer; color:var(--accent); line-height:1;
  }
  .date-bar button.cal-toggle.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-top button{background:none; border:none; color:var(--accent); font-size:20px; font-weight:800; padding:4px 10px; cursor:pointer;}
  .cal-top .label{font-weight:800; text-transform:capitalize; font-size:16px;}
  .weekdays,.days{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .weekdays div{text-align:center; font-size:11px; color:var(--muted); font-weight:700;}
  .days button{
    aspect-ratio:1; border:none; background:transparent; border-radius:10px;
    font-weight:700; color:var(--text); font-size:14px; cursor:pointer; position:relative;
  }
  .days button.today{outline:2px solid var(--accent-light);}
  .days button.selected{background:var(--accent); color:#fff;}
  .days button .dot{
    position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%; background:var(--accent-light);
  }
  .days button.selected .dot{background:#fff;}
  .selected-date{font-weight:800; font-size:15px; margin:4px 0 12px;}
  .add-row{display:flex; gap:8px; margin-bottom:14px;}
  .add-row input[type="text"]{
    flex:1; border:1px solid var(--card-border); border-radius:10px; padding:11px 12px;
    font-size:15px; background:var(--card); color:var(--text); font-weight:700;
  }
  .add-row input[type="time"]{
    width:92px; border:1px solid var(--card-border); border-radius:10px; padding:11px 6px;
    font-size:14px; background:var(--card); color:var(--text); font-weight:700;
  }
  .task-time{
    font-weight:800; font-size:12.5px; color:var(--accent); background:var(--done-bg);
    border-radius:7px; padding:3px 7px; flex:none;
  }
  .task.done .task-time{color:var(--muted);}
  .add-row button{
    background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px;
    font-weight:800; font-size:20px; cursor:pointer;
  }
  .task{background:var(--card); border:1px solid var(--card-border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .task.done{background:var(--done-bg);}
  .task-row{display:flex; align-items:center; gap:10px; padding:12px;}
  .checkbox{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--accent);
    flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; background:transparent;
  }
  .checkbox.checked{background:var(--accent); color:#fff; font-weight:900;}
  .task-title{flex:1; font-weight:800; font-size:15.5px;}
  .task.done .task-title{text-decoration:line-through; color:var(--muted);}
  .icon-btn{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 6px;}
  .sub-panel{border-top:1px solid var(--card-border); padding:10px 12px 12px 46px;}
  .sub-item{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .sub-item .checkbox{width:18px; height:18px; border-width:2px; font-size:11px;}
  .sub-item span{flex:1; font-weight:600; font-size:14px;}
  .sub-item.done span{text-decoration:line-through; color:var(--muted);}
  .sub-add{display:flex; gap:6px; margin-top:6px;}
  .sub-add input{flex:1; border:1px solid var(--card-border); border-radius:8px; padding:7px 9px; font-size:13.5px; background:var(--bg); color:var(--text); font-weight:600;}
  .sub-add button{background:var(--accent-light); color:#fff; border:none; border-radius:8px; padding:0 12px; font-weight:800; cursor:pointer;}
  .empty{text-align:center; color:var(--muted); font-weight:700; padding:30px 10px;}
  .finish-bar{
    position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--bg); border-top:1px solid var(--card-border); max-width:520px; margin:0 auto;
  }
  .finish-btn{
    width:100%; border:none; border-radius:12px; padding:14px; font-weight:800; font-size:15.5px; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  .finish-btn.done{background:var(--done-bg); color:var(--accent); border:2px solid var(--accent);}
  .status{font-size:12px; text-align:center; color:var(--muted); font-weight:700; padding-bottom:6px;}
</style>
</head>

n id="statusDot" style="font-size:11px;"></span></header>
<div class="container">
  <div class="date-bar">
    <button class="nav" id="prevDay">‹</button>
    <div class="date-bar-label" id="selectedDateLabel"></div>
    <button class="nav" id="nextDay">›</button>
    <button class="cal-toggle" id="calToggleBtn">📅</button>
  </div>
  <div class="cal" id="calPanel">
    <div class="cal-top">
      <button id="prevMonth">‹</button>
      <div class="label" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>
    <div class="weekdays"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
    <div class="days" id="daysGrid"></div>
  </div>
  <div class="add-row">
    <input type="text" id="newTaskInput" placeholder="Adicionar tarefa..." />
    <input type="time" id="newTaskTime" />
    <button id="addTaskBtn">+</button>
  </div>
  <div id="tasksList"></div>
</div>
<div class="finish-bar">
  <button class="finish-btn" id="finishBtn">Concluir o dia</button>
</div>

<script>
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = fmt(new Date());

let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();
let selectedDate = todayStr;
let calendarOpen = false;

let db = null, userNs = null, uid = null;
let tasksCol = null, daysCol = null;
let tasksById = {};      // all tasks, keyed by id
let daysById = {};       // day-completion docs, keyed by date string
let unsubTasks = null, unsubDays = null;

// ---- localStorage fallback (used only if db/user unavailable) ----
const LS_KEY = 'listou_fallback_v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {tasks:{}, days:{}}; }catch(e){ return {tasks:{}, days:{}}; } }
function lsSave(data){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
let usingFallback = false;

function setStatus(text){ document.getElementById('statusDot').textContent = text; }

async function initStorage(){
  try{
    claude && claude.use && (db = await claude.use('db'));
  }catch(e){ db = null; }
  try{
    userNs = window.claude ? await claude.use('user') : null;
  }catch(e){ userNs = null; }
  if(userNs){ try{ uid = await userNs.id(); }catch(e){ uid = null; } }

  if(db && uid){
    const profileDoc = db.doc(`data/users/${uid}/profile`);
    tasksCol = profileDoc.collection('tasks');
    daysCol = profileDoc.collection('days');
    setStatus('sincronizado');
    unsubTasks = tasksCol.onSnapshot(snap=>{
      tasksById = {};
      snap.docs.forEach(d=>{ tasksById[d.id] = {id:d.id, ...d.data()}; });
      render();
    }, ()=>{ setStatus('erro de sincronização'); });
    unsubDays = daysCol.onSnapshot(snap=>{
      daysById = {};
      snap.docs.forEach(d=>{ daysById[d.id] = d.data(); });
      render();
    }, ()=>{});
  } else {
    usingFallback = true;
    setStatus('salvo neste dispositivo');
    const data = lsLoad();
    tasksById = data.tasks; daysById = data.days;
    render();
  }
}

function fallbackPersist(){
  if(usingFallback) lsSave({tasks:tasksById, days:daysById});
}

// ---- CRUD ----
async function addTask(title, time){
  if(!title.trim()) return;
  const timeVal = time && time.trim() ? time.trim() : null;
  if(usingFallback){
    const id = 't'+Date.now();
    tasksById[id] = {id, title:title.trim(), time:timeVal, date:selectedDate, done:false, subItems:[], createdAt:Date.now()};
    fallbackPersist(); render();
  } else {
    await tasksCol.add({title:title.trim(), time:timeVal, date:selectedDate, done:false, subItems:[], createdAt:Date.now()});
  }
}
async function toggleTask(id){
  const t = tasksById[id]; if(!t) return;
  const done = !t.done;
  if(usingFallback){ t.done = done; fallbackPersist(); render(); }
  else { await tasksCol.doc(id).update({done}); }
}
async function deleteTask(id){
  if(usingFallback){ delete tasksById[id]; fallbackPersist(); render(); }
  else { await tasksCol.doc(id).delete(); }
}
async function updateSubItems(id, subItems){
  if(usingFallback){ tasksById[id].subItems = subItems; fallbackPersist(); render(); }
  else { await tasksCol.doc(id).update({subItems}); }
}
async function toggleDay(dateStr){
  const cur = daysById[dateStr];
  const completed = !(cur && cur.completed);
  if(usingFallback){ daysById[dateStr] = {completed, completedAt:Date.now()}; fallbackPersist(); render(); }
  else { await daysCol.doc(dateStr).set({completed, completedAt:Date.now()}); }
}

// ---- rendering ----
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let openTaskId = null;

function renderCalendar(){
  document.getElementById('monthLabel').textContent = `${MESES[viewMonth]} ${viewYear}`;
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const first = new Date(viewYear, viewMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  for(let i=0;i<startWeekday;i++){ grid.appendChild(document.createElement('div')); }
  for(let day=1; day<=daysInMonth; day++){
    const dStr = `${viewYear}-${pad(viewMonth+1)}-${pad(day)}`;
    const btn = document.createElement('button');
    btn.textContent = day;
    if(dStr === todayStr) btn.classList.add('today');
    if(dStr === selectedDate) btn.classList.add('selected');
    const hasTasks = Object.values(tasksById).some(t=>t.date===dStr);
    if(hasTasks){ const dot = document.createElement('div'); dot.className='dot'; btn.appendChild(dot); }
    btn.onclick = ()=>{ selectedDate = dStr; openTaskId=null; calendarOpen=false; render(); };
    grid.appendChild(btn);
  }
}

function renderTasks(){
  const label = document.getElementById('selectedDateLabel');
  const [y,m,d] = selectedDate.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  label.textContent = dateObj.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});

  const list = document.getElementById('tasksList');
  list.innerHTML = '';
  const dayTasks = Object.values(tasksById).filter(t=>t.date===selectedDate).sort((a,b)=>{
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time && !b.time) return -1;
    if(!a.time && b.time) return 1;
    return (a.createdAt||0)-(b.createdAt||0);
  });

  if(dayTasks.length===0){
    list.innerHTML = '<div class="empty">Nenhuma tarefa para este dia ainda.</div>';
  }

  dayTasks.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'task' + (t.done ? ' done' : '');

    const row = document.createElement('div');
    row.className = 'task-row';

    const cb = document.createElement('button');
    cb.className = 'checkbox' + (t.done ? ' checked' : '');
    cb.textContent = t.done ? '✓' : '';
    cb.onclick = ()=>toggleTask(t.id);
    row.appendChild(cb);

    if(t.time){
      const timeBadge = document.createElement('div');
      timeBadge.className = 'task-time';
      timeBadge.textContent = t.time;
      row.appendChild(timeBadge);
    }

    const title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = t.title;
    title.onclick = ()=>{ openTaskId = (openTaskId===t.id) ? null : t.id; render(); };
    row.appendChild(title);

    const sub = (t.subItems||[]);
    const expandBtn = document.createElement('button');
    expandBtn.className = 'icon-btn';
    expandBtn.textContent = (openTaskId===t.id ? '▲' : '▾') + (sub.length? ` ${sub.filter(s=>s.done).length}/${sub.length}` : '');
    expandBtn.onclick = ()=>{ openTaskId = (openTaskId===t.id) ? null : t.id; render(); };
    row.appendChild(expandBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = '✕';
    delBtn.onclick = ()=>deleteTask(t.id);
    row.appendChild(delBtn);

    card.appendChild(row);

    if(openTaskId === t.id){
      const panel = document.createElement('div');
      panel.className = 'sub-panel';
      sub.forEach((item, idx)=>{
        const sRow = document.createElement('div');
        sRow.className = 'sub-item' + (item.done? ' done':'');
        const sCb = document.createElement('button');
        sCb.className = 'checkbox' + (item.done? ' checked':'');
        sCb.textContent = item.done ? '✓' : '';
        sCb.onclick = ()=>{
          const arr = sub.map((s,i)=> i===idx ? {...s, done:!s.done} : s);
          updateSubItems(t.id, arr);
        };
        sRow.appendChild(sCb);
        const sSpan = document.createElement('span');
        sSpan.textContent = item.text;
        sRow.appendChild(sSpan);
        const sDel = document.createElement('button');
        sDel.className = 'icon-btn'; sDel.textContent = '✕';
        sDel.onclick = ()=>{
          const arr = sub.filter((_,i)=>i!==idx);
          updateSubItems(t.id, arr);
        };
        sRow.appendChild(sDel);
        panel.appendChild(sRow);
      });
      const addRow = document.createElement('div');
      addRow.className = 'sub-add';
      const input = document.createElement('input');
      input.placeholder = 'Adicionar item à lista...';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      const doAdd = ()=>{
        if(!input.value.trim()) return;
        const arr = [...sub, {text:input.value.trim(), done:false}];
        updateSubItems(t.id, arr);
        input.value = '';
      };
      addBtn.onclick = doAdd;
      input.onkeydown = (e)=>{ if(e.key==='Enter') doAdd(); };
      addRow.appendChild(input); addRow.appendChild(addBtn);
      panel.appendChild(addRow);
      card.appendChild(panel);
    }
    list.appendChild(card);
  });

  const finishBtn = document.getElementById('finishBtn');
  const dayDone = daysById[selectedDate] && daysById[selectedDate].completed;
  finishBtn.textContent = dayDone ? '✓ Dia concluído' : 'Concluir o dia';
  finishBtn.className = 'finish-btn' + (dayDone ? ' done' : '');
}

function render(){
  renderCalendar();
  renderTasks();
  const panel = document.getElementById('calPanel');
  const toggleBtn = document.getElementById('calToggleBtn');
  panel.style.display = calendarOpen ? 'block' : 'none';
  toggleBtn.classList.toggle('active', calendarOpen);
}

document.getElementById('prevMonth').onclick = ()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} render();
};
document.getElementById('nextMonth').onclick = ()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} render();
};
document.getElementById('calToggleBtn').onclick = ()=>{
  calendarOpen = !calendarOpen;
  if(calendarOpen){
    const [y,m] = selectedDate.split('-').map(Number);
    viewYear = y; viewMonth = m-1;
  }
  render();
};
function shiftDay(delta){
  const [y,m,d] = selectedDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  selectedDate = fmt(dt);
  viewYear = dt.getFullYear(); viewMonth = dt.getMonth();
  openTaskId = null;
  render();
}
document.getElementById('prevDay').onclick = ()=>shiftDay(-1);
document.getElementById('nextDay').onclick = ()=>shiftDay(1);
function submitNewTask(){
  const inp = document.getElementById('newTaskInput');
  const timeInp = document.getElementById('newTaskTime');
  if(!inp.value.trim()) return;
  addTask(inp.value, timeInp.value);
  inp.value = ''; timeInp.value = '';
}
document.getElementById('addTaskBtn').onclick = submitNewTask;
document.getElementById('newTaskInput').onkeydown = (e)=>{
  if(e.key==='Enter'){ submitNewTask(); }
};
document.getElementById('finishBtn').onclick = ()=>toggleDay(selectedDate);

initStorage();
</script>
</body>
</html>
